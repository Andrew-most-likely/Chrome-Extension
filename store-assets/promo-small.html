<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 440px; height: 280px;
  background: #0d1117;
  font-family: -apple-system, 'Segoe UI', sans-serif;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden; position: relative;
}
.bg-glow {
  position: absolute; width: 360px; height: 360px;
  background: radial-gradient(circle, rgba(99,102,241,0.22) 0%, transparent 65%);
  top: -100px; right: -80px; pointer-events: none;
}
.bg-glow2 {
  position: absolute; width: 220px; height: 220px;
  background: radial-gradient(circle, rgba(129,140,248,0.1) 0%, transparent 70%);
  bottom: -60px; left: -40px;
}
.grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(99,102,241,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(99,102,241,0.05) 1px, transparent 1px);
  background-size: 28px 28px;
}
.content {
  position: relative; z-index: 2;
  display: flex; flex-direction: column;
  align-items: center; gap: 14px; padding: 32px;
}
.shield {
  width: 60px; height: 60px;
  background: rgba(99,102,241,0.15);
  border: 1.5px solid rgba(99,102,241,0.45);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 40px rgba(99,102,241,0.25);
}
.shield svg { fill: #818cf8; }
.title {
  font-size: 28px; font-weight: 800;
  color: #f0f6fc; letter-spacing: -0.03em; text-align: center;
}
.subtitle {
  font-size: 12px; color: rgba(240,246,252,0.5);
  text-align: center; line-height: 1.6; max-width: 310px;
}
.badges {
  display: flex; gap: 7px; flex-wrap: wrap; justify-content: center;
}
.badge {
  font-size: 10px; font-weight: 700;
  padding: 3px 10px; border-radius: 20px; letter-spacing: 0.04em;
  text-transform: uppercase;
}
.badge.red    { background: rgba(239,68,68,0.12);  color: #f87171; border: 1px solid rgba(239,68,68,0.25); }
.badge.indigo { background: rgba(99,102,241,0.12); color: #818cf8; border: 1px solid rgba(99,102,241,0.3); }
.badge.orange { background: rgba(251,146,60,0.12); color: #fb923c; border: 1px solid rgba(251,146,60,0.25); }
.badge.green  { background: rgba(74,222,128,0.1);  color: #4ade80; border: 1px solid rgba(74,222,128,0.2); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-glow2"></div>
<div class="grid"></div>
<div class="content">
  <div class="shield">
    <svg width="30" height="30" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
  </div>
  <div class="title">Vanta Security</div>
  <div class="subtitle">Real-time protection against phishing, malware, and payment fraud — powered by Google Safe Browsing</div>
  <div class="badges">
    <span class="badge red">Phishing</span>
    <span class="badge red">Malware</span>
    <span class="badge indigo">Pay Redirect</span>
    <span class="badge orange">Typosquatting</span>
    <span class="badge green">Free</span>
  </div>
</div>
</body>
</html>
