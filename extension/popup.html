<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vanta Security</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      width: 360px;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ── */
    .header {
      background: #161b22;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon {
      width: 32px; height: 32px;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .header-icon svg { fill: #818cf8; }
    .header h1   { font-size: 14px; font-weight: 700; color: #f0f6fc; letter-spacing: -0.01em; }
    .header p    { font-size: 11px; color: rgba(240,246,252,0.45); margin-top: 1px; }

    /* ── Toggle bar ── */
    .toggle-bar {
      padding: 9px 16px;
      background: #161b22;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      color: rgba(240,246,252,0.7);
    }
    .toggle-label span {
      font-weight: 600;
    }
    .toggle-label span.on  { color: #4ade80; }
    .toggle-label span.off { color: rgba(240,246,252,0.3); }

    /* pill toggle switch */
    .toggle-switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0; height: 0;
      position: absolute;
    }
    .toggle-track {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.12);
      cursor: pointer;
      transition: background 200ms, border-color 200ms;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: rgba(240,246,252,0.4);
      transition: transform 200ms, background 200ms;
    }
    .toggle-switch input:checked + .toggle-track {
      background: rgba(99,102,241,0.35);
      border-color: #6366f1;
    }
    .toggle-switch input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: #818cf8;
    }

    /* ── Tab status bar ── */
    .tab-status-bar {
      padding: 8px 16px;
      background: #161b22;
      border-bottom: 1px solid rgba(255,255,255,0.07);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .tab-status-info {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      min-width: 0;
    }
    .tab-status-label {
      color: rgba(240,246,252,0.45);
      flex-shrink: 0;
    }
    .tab-status-value {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .tab-status-value.loading   { color: rgba(240,246,252,0.3); }
    .tab-status-value.clean     { color: #4ade80; }
    .tab-status-value.blocked   { color: #f87171; }
    .tab-status-value.whitelisted { color: #4ade80; }
    .tab-status-value.bypassed  { color: #fb923c; }
    .tab-status-value.disabled  { color: rgba(240,246,252,0.3); }
    .tab-status-value.unknown   { color: rgba(240,246,252,0.3); }
    .scan-btn {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      padding: 4px 10px;
      background: rgba(99,102,241,0.15);
      color: #818cf8;
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 5px;
      cursor: pointer;
      transition: background 150ms, color 150ms;
    }
    .scan-btn:hover  { background: rgba(99,102,241,0.3); color: #a5b4fc; }
    .scan-btn:active { background: rgba(99,102,241,0.45); }
    .scan-btn:disabled { opacity: 0.4; cursor: default; }

    /* ── Section title row (with action button) ── */
    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .section-title-row .section-title { margin-bottom: 0; }
    .clear-btn {
      font-size: 9px;
      font-weight: 600;
      font-family: inherit;
      padding: 2px 7px;
      background: none;
      color: rgba(240,246,252,0.25);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      cursor: pointer;
      transition: background 120ms, color 120ms, border-color 120ms;
    }
    .clear-btn:hover { background: rgba(239,68,68,0.1); color: #f87171; border-color: rgba(239,68,68,0.3); }

    /* ── Tally row ── */
    .tally {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid rgba(255,255,255,0.07);
      background: #0d1117;
    }
    .tally-item {
      padding: 14px 6px;
      text-align: center;
      border-right: 1px solid rgba(255,255,255,0.07);
    }
    .tally-item:last-child { border-right: none; }
    .tally-value {
      font-size: 22px;
      font-weight: 800;
      color: #818cf8;
      line-height: 1;
      letter-spacing: -0.02em;
    }
    .tally-value.zero { color: rgba(240,246,252,0.2); }
    .tally-label {
      font-size: 9px;
      color: rgba(240,246,252,0.4);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      line-height: 1.3;
    }

    /* ── Sections ── */
    .section { padding: 12px 16px 6px; }
    .section-title {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: rgba(240,246,252,0.35);
      margin-bottom: 8px;
    }

    /* ── History list ── */
    .history-list { list-style: none; max-height: 150px; overflow-y: auto; }
    .history-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 12px;
    }
    .history-list li:last-child { border-bottom: none; }

    /* ── Threat tags ── */
    .threat-tag {
      font-size: 8.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .tag-MALWARE                         { background: rgba(239,68,68,0.15);  color: #f87171; }
    .tag-SOCIAL_ENGINEERING              { background: rgba(239,68,68,0.15);  color: #f87171; }
    .tag-UNWANTED_SOFTWARE               { background: rgba(251,146,60,0.15); color: #fb923c; }
    .tag-POTENTIALLY_HARMFUL_APPLICATION { background: rgba(251,146,60,0.15); color: #fb923c; }
    .tag-PAYMENT_REDIRECT                { background: rgba(99,102,241,0.15); color: #818cf8; }
    .tag-HEURISTIC                       { background: rgba(251,146,60,0.15); color: #fb923c; }
    .tag-FORM_HIJACK                     { background: rgba(239,68,68,0.15);  color: #f87171; }
    .tag-UNKNOWN_THREAT                  { background: rgba(240,246,252,0.08); color: rgba(240,246,252,0.4); }

    .history-info { flex: 1; min-width: 0; }
    .history-domain {
      font-weight: 500;
      color: #f0f6fc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-time { font-size: 10px; color: rgba(240,246,252,0.35); margin-top: 2px; }

    .empty-state {
      font-size: 12px;
      color: rgba(240,246,252,0.3);
      padding: 6px 0 10px;
      font-style: italic;
    }

    /* ── Bypassed / Whitelist ── */
    .bypass-list, .whitelist-list { list-style: none; max-height: 80px; overflow-y: auto; }
    .bypass-list li, .whitelist-list li {
      font-size: 11px;
      color: rgba(240,246,252,0.7);
      padding: 4px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-all;
    }
    .bypass-list li::before  { content: "⚠"; color: #fb923c; flex-shrink: 0; font-size: 10px; }
    .whitelist-list li::before { content: "✓"; color: #4ade80; flex-shrink: 0; font-size: 10px; }
    .list-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: rgba(240,246,252,0.25);
      cursor: pointer;
      font-size: 10px;
      padding: 2px 4px;
      border-radius: 3px;
      line-height: 1;
      transition: background 120ms, color 120ms;
    }
    .remove-btn:hover { background: rgba(239,68,68,0.12); color: #f87171; }

    /* ── Whitelist add ── */
    .whitelist-add { display: flex; gap: 6px; margin-bottom: 6px; }
    .whitelist-add input {
      flex: 1;
      font-size: 11px;
      font-family: inherit;
      padding: 5px 9px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #f0f6fc;
      outline: none;
      min-width: 0;
      transition: border-color 150ms;
    }
    .whitelist-add input:focus { border-color: #6366f1; }
    .whitelist-add input::placeholder { color: rgba(240,246,252,0.25); }
    .whitelist-add button {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      padding: 5px 12px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 150ms;
    }
    .whitelist-add button:hover { background: #4f46e5; }

    /* ── Footer ── */
    footer {
      padding: 9px 16px;
      font-size: 10px;
      color: rgba(240,246,252,0.25);
      border-top: 1px solid rgba(255,255,255,0.07);
      background: #161b22;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
    </div>
    <div>
      <h1>Vanta Security</h1>
      <p>Real-time protection active</p>
    </div>
  </div>

  <div class="toggle-bar">
    <div class="toggle-label">Protection: <span id="toggle-state" class="on">On</span></div>
    <label class="toggle-switch" aria-label="Toggle protection">
      <input type="checkbox" id="protection-toggle" checked />
      <div class="toggle-track"></div>
    </label>
  </div>

  <div class="tab-status-bar" id="tab-status-bar">
    <div class="tab-status-info">
      <span class="tab-status-label">This page:</span>
      <span id="tab-status-text" class="tab-status-value loading">Checking...</span>
    </div>
    <button id="scan-btn" class="scan-btn">Scan</button>
  </div>

  <div class="tally">
    <div class="tally-item">
      <div class="tally-value" id="tally-total">0</div>
      <div class="tally-label">Total Blocked</div>
    </div>
    <div class="tally-item">
      <div class="tally-value" id="tally-phishing">0</div>
      <div class="tally-label">Phishing</div>
    </div>
    <div class="tally-item">
      <div class="tally-value" id="tally-malware">0</div>
      <div class="tally-label">Malware</div>
    </div>
    <div class="tally-item">
      <div class="tally-value" id="tally-payment">0</div>
      <div class="tally-label">Pay Redirect</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title-row">
      <div class="section-title">Recent blocks</div>
      <button id="clear-history-btn" class="clear-btn">Clear</button>
    </div>
    <ul class="history-list" id="history-list">
      <li class="empty-state">No threats blocked yet</li>
    </ul>
  </div>

  <div class="section">
    <div class="section-title">Bypassed this session</div>
    <ul class="bypass-list" id="bypass-list">
      <li class="empty-state" style="list-style:none;padding:4px 0 8px">None</li>
    </ul>
  </div>

  <div class="section">
    <div class="section-title">Whitelisted domains</div>
    <div class="whitelist-add">
      <input type="text" id="whitelist-input" placeholder="example.com" autocomplete="off" spellcheck="false" />
      <button id="whitelist-add-btn">Add</button>
    </div>
    <ul class="whitelist-list" id="whitelist-list">
      <li class="empty-state" style="list-style:none;padding:4px 0 8px">None</li>
    </ul>
  </div>

  <footer>Protected by Google Safe Browsing API v4</footer>

  <script src="popup.js"></script>
</body>
</html>
