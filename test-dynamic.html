<!DOCTYPE html>
<html>
<head><title>Test: Dynamically injected script</title></head>
<body>
  <h1>Dynamic Script Injection Test</h1>
  <p>Simulates a page that injects a malicious script via XHR/fetch callback.</p>
  <script>
    // Simulates a script tag being injected after page load (e.g. from an ad or XHR callback)
    setTimeout(function () {
      const s = document.createElement("script");
      s.textContent = 'window.location.href = "https://cash.app/pay/hacker"';
      document.body.appendChild(s);
    }, 1000);
  </script>
</body>
</html>
