<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phishing Detector</title>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #fff;
      color: #202124;
      width: 340px;
    }

    /* Header */
    .header {
      background: #1a73e8;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header img  { width: 28px; height: 28px; border-radius: 4px; }
    .header h1   { font-size: 15px; font-weight: 600; }
    .header p    { font-size: 11px; opacity: 0.85; margin-top: 1px; }

    /* Status bar */
    .status {
      padding: 7px 16px;
      background: #e6f4ea;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #137333;
      border-bottom: 1px solid #d2e3cc;
    }
    .status-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #34a853;
      flex-shrink: 0;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.35; }
    }

    /* Tally row */
    .tally {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-bottom: 1px solid #e8eaed;
    }
    .tally-item {
      padding: 12px 6px;
      text-align: center;
      border-right: 1px solid #e8eaed;
    }
    .tally-item:last-child { border-right: none; }
    .tally-value {
      font-size: 22px;
      font-weight: 700;
      color: #c5221f;
      line-height: 1;
    }
    .tally-value.zero { color: #bdc1c6; }
    .tally-label {
      font-size: 9px;
      color: #5f6368;
      margin-top: 3px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }

    /* Sections */
    .section { padding: 10px 16px 4px; }
    .section-title {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #5f6368;
      margin-bottom: 6px;
    }

    /* History list */
    .history-list {
      list-style: none;
      max-height: 160px;
      overflow-y: auto;
    }
    .history-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 5px 0;
      border-bottom: 1px solid #f1f3f4;
      font-size: 12px;
    }
    .history-list li:last-child { border-bottom: none; }

    .threat-tag {
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 2px 5px;
      border-radius: 3px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .tag-MALWARE                    { background: #fce8e6; color: #c5221f; }
    .tag-SOCIAL_ENGINEERING         { background: #fce8e6; color: #c5221f; }
    .tag-UNWANTED_SOFTWARE          { background: #fef7e0; color: #b06000; }
    .tag-POTENTIALLY_HARMFUL_APPLICATION { background: #fef7e0; color: #b06000; }
    .tag-PAYMENT_REDIRECT           { background: #e8f0fe; color: #1a55b0; }
    .tag-HEURISTIC                  { background: #fef7e0; color: #b06000; }
    .tag-FORM_HIJACK                { background: #fce8e6; color: #c5221f; }
    .tag-UNKNOWN_THREAT             { background: #f1f3f4; color: #5f6368; }

    .history-info { flex: 1; min-width: 0; }
    .history-domain {
      font-weight: 500;
      color: #202124;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-time {
      font-size: 10px;
      color: #9aa0a6;
      margin-top: 1px;
    }

    .empty-state {
      font-size: 12px;
      color: #9aa0a6;
      padding: 6px 0 10px;
      font-style: italic;
    }

    /* Bypassed / Whitelist lists */
    .bypass-list, .whitelist-list { list-style: none; max-height: 80px; overflow-y: auto; }
    .bypass-list li, .whitelist-list li {
      font-size: 11px;
      color: #3c4043;
      padding: 3px 0;
      border-bottom: 1px solid #f1f3f4;
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-all;
    }
    .bypass-list li::before  { content: "⚠"; color: #f29900; flex-shrink: 0; font-size: 10px; }
    .whitelist-list li::before { content: "✓"; color: #137333; flex-shrink: 0; font-size: 10px; }
    .list-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      color: #9aa0a6;
      cursor: pointer;
      font-size: 10px;
      padding: 1px 3px;
      border-radius: 2px;
      line-height: 1;
    }
    .remove-btn:hover { background: #f1f3f4; color: #c5221f; }

    .whitelist-add {
      display: flex;
      gap: 5px;
      margin-bottom: 6px;
    }
    .whitelist-add input {
      flex: 1;
      font-size: 11px;
      font-family: inherit;
      padding: 4px 7px;
      border: 1px solid #e8eaed;
      border-radius: 4px;
      color: #202124;
      outline: none;
      min-width: 0;
    }
    .whitelist-add input:focus { border-color: #1a73e8; }
    .whitelist-add input::placeholder { color: #9aa0a6; }
    .whitelist-add button {
      flex-shrink: 0;
      font-size: 11px;
      font-weight: 600;
      font-family: inherit;
      padding: 4px 10px;
      background: #1a73e8;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .whitelist-add button:hover { background: #1765cc; }

    footer {
      padding: 8px 16px;
      font-size: 10px;
      color: #9aa0a6;
      border-top: 1px solid #e8eaed;
    }
  </style>
</head>
<body>

  <div class="header">
    <img src="icons/icon48.png" alt="Phishing Detector" />
    <div>
      <h1>Phishing Detector</h1>
      <p>Real-time protection active</p>
    </div>
  </div>

  <div class="status">
    <div class="status-dot"></div>
    <span>Monitoring all navigations</span>
  </div>

  <div class="tally">
    <div class="tally-item">
      <div class="tally-value" id="tally-total">0</div>
      <div class="tally-label">Total Blocked</div>
    </div>
    <div class="tally-item">
      <div class="tally-value" id="tally-phishing">0</div>
      <div class="tally-label">Phishing</div>
    </div>
    <div class="tally-item">
      <div class="tally-value" id="tally-malware">0</div>
      <div class="tally-label">Malware</div>
    </div>
    <div class="tally-item">
      <div class="tally-value" id="tally-payment">0</div>
      <div class="tally-label">Payment Redirect</div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Recent blocks</div>
    <ul class="history-list" id="history-list">
      <li class="empty-state">No threats blocked yet</li>
    </ul>
  </div>

  <div class="section">
    <div class="section-title">Bypassed this session</div>
    <ul class="bypass-list" id="bypass-list">
      <li class="empty-state" style="list-style:none;padding:4px 0 8px">None</li>
    </ul>
  </div>

  <div class="section">
    <div class="section-title">Whitelisted domains</div>
    <div class="whitelist-add">
      <input type="text" id="whitelist-input" placeholder="example.com" autocomplete="off" spellcheck="false" />
      <button id="whitelist-add-btn">Add</button>
    </div>
    <ul class="whitelist-list" id="whitelist-list">
      <li class="empty-state" style="list-style:none;padding:4px 0 8px">None</li>
    </ul>
  </div>

  <footer>Protected by Google Safe Browsing API v4</footer>

  <script src="popup.js"></script>
</body>
</html>
